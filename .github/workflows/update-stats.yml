name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 * * * *" # Primary hourly run.
    - cron: "47 * * * *" # Backup in case GitHub delays or drops the primary run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Enforce one-hour refresh interval
        id: hourly_gate
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          last_refresh="$(sed -nE 's/.*data-updated-at="([0-9]+)".*/\1/p' profile/last-updated.svg)"
          current_time="$(date +%s)"
          if [[ ! "$last_refresh" =~ ^[0-9]+$ ]]; then
            echo "No valid refresh timestamp found; running once to initialize the hourly gate."
            last_refresh=0
          fi
          elapsed=$((current_time - last_refresh))
          if (( elapsed >= 3600 )); then
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
            echo "The profile was refreshed ${elapsed}s ago; skipping this backup schedule."
          fi

      - name: Generate GitHub statistics
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # count_private is not supported; private data depends on token access.
          # Match the public /api?username=varunkarthic card's last-year semantics.
          options: username=varunkarthic&theme=github_dark&hide_border=true&include_all_commits=false&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate language statistics
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=varunkarthic&theme=github_dark&hide_border=true&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate contribution streak
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        with:
          options: user=varunkarthic&background=0D1117&border=0D1117&stroke=E4E2E2&ring=1F6FEB&fire=58A6FF&currStreakNum=FEFEFE&sideNums=58A6FF&currStreakLabel=FEFEFE&sideLabels=FEFEFE&dates=9E9E9E&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.STATS_PAT || github.token }}

      - name: Generate last-updated badge
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        shell: bash
        run: |
          updated_at="$(date +%s)"
          timestamp="$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')"
          cat > profile/last-updated.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="370" height="34" data-updated-at="${updated_at}" role="img" aria-label="Last updated: ${timestamp}">
            <title>Last updated: ${timestamp}</title>
            <rect x="0.5" y="0.5" width="369" height="33" rx="6" fill="#0D1117" stroke="#30363D"/>
            <path d="M17 17a7 7 0 1 1 14 0a7 7 0 1 1-14 0" fill="none" stroke="#58A6FF" stroke-width="1.5"/>
            <path d="M24 12.5v4.8l3 1.8" fill="none" stroke="#58A6FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="84" y="21" fill="#C9D1D9" font-family="Verdana,DejaVu Sans,sans-serif" font-size="10" font-weight="600" letter-spacing=".5" text-anchor="middle">LAST UPDATED</text>
            <path d="M145 7v20" stroke="#30363D"/>
            <text x="258" y="21" fill="#58A6FF" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" font-weight="600" text-anchor="middle">${timestamp}</text>
          </svg>
          EOF

      - name: Refresh README image cache keys
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        shell: bash
        run: |
          sed -i -E "s#(\./profile/(stats|top-langs|streak|last-updated)\.svg)(\?v=[^\"[:space:]]*)?#\1?v=${GITHUB_RUN_ID}#g" README.md
          for card in stats top-langs streak last-updated; do
            if ! grep -Fq "./profile/${card}.svg?v=${GITHUB_RUN_ID}" README.md; then
              echo "README is missing the expected image reference for ${card}.svg." >&2
              exit 1
            fi
          done

      - name: Commit changed cards and README
        if: github.event_name != 'schedule' || steps.hourly_gate.outputs.should_refresh == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/stats.svg profile/top-langs.svg profile/streak.svg profile/last-updated.svg
          if git diff --cached --quiet; then
            echo "No changes to the profile README or statistics cards."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated GitHub statistics" \
            -m "Regenerate the stats, top-languages, contribution-streak cards, and IST update badge. Refresh README image cache keys so GitHub displays the generated cards." \
            -m "Generated by GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push
