name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC (05:47 IST).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # count_private is not supported; private data depends on token access.
          # Match the public /api?username=varunkarthic card's last-year semantics.
          options: username=varunkarthic&theme=github_dark&hide_border=true&include_all_commits=false&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=varunkarthic&theme=github_dark&hide_border=true&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Commit changed SVGs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No changes to statistics cards."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated GitHub statistics" \
            -m "Regenerate the stats and top-languages cards from GitHub API data. Only changed profile/stats.svg and profile/top-langs.svg files are included." \
            -m "Generated by GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push
