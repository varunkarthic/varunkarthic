name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 * * * *" # Hourly at 17 minutes past each hour (UTC).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # count_private is not supported; private data depends on token access.
          # Match the public /api?username=varunkarthic card's last-year semantics.
          options: username=varunkarthic&theme=github_dark&hide_border=true&include_all_commits=false&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=varunkarthic&theme=github_dark&hide_border=true&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT || github.token }}
          fail_on_error: true

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        with:
          options: user=varunkarthic&background=0D1117&border=0D1117&stroke=E4E2E2&ring=1F6FEB&fire=58A6FF&currStreakNum=FEFEFE&sideNums=58A6FF&currStreakLabel=FEFEFE&sideLabels=FEFEFE&dates=9E9E9E&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.STATS_PAT || github.token }}

      - name: Commit changed SVGs only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "No changes to profile statistics cards."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated GitHub statistics" \
            -m "Regenerate the stats, top-languages, and contribution-streak cards from GitHub API data. Only changed profile/stats.svg, profile/top-langs.svg, and profile/streak.svg files are included." \
            -m "Generated by GitHub Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push
